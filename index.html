<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earning Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: radial-gradient(circle at top right, rgba(230,253,245,0.7) 0%, rgba(245,243,255,0.7) 100%), #f8fafc; min-height: 100vh; padding-bottom: 100px; }
        .app-container { width: 100%; max-width: 480px; padding: 18px; margin: 0 auto; position: relative; }
        
        /* Smooth View Transitions */
        .app-view { display: none; }
        .app-view.active { display: block; }

        /* --- HOME SCREEN --- */
        .main-balance-wrapper { margin: 20px 0 15px 5px; }
        .main-balance-text { font-size: 2.5rem; font-weight: 800; color: #1e293b; letter-spacing: -1px; }
        .main-balance-text span { color: #2563eb; font-weight: 800; margin-right: 5px; }
        .glass-card-section { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 28px; padding: 16px; border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03); margin-bottom: 22px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-card { background: white; padding: 16px 14px; border-radius: 20px; border: 1px solid #f1f5f9; }
        .stat-card .label { font-size: 0.68rem; color: #64748b; font-weight: 800; margin-bottom: 6px; }
        .stat-card .value { font-size: 1.25rem; font-weight: 700; color: #0f172a; }
        .actions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 22px; }
        .action-card { border-radius: 24px; padding: 22px 10px; text-align: center; color: white; cursor: pointer; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06); }
        .action-card i { font-size: 1.6rem; margin-bottom: 12px; display: block; }
        .action-card span { font-size: 0.75rem; font-weight: 800; }
        .bg-deposit { background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%); }
        .bg-withdraw { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .bg-task { background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%); }

        /* --- SCREENS COMMON HEADER --- */
        .screen-header { display: flex; align-items: center; gap: 15px; margin: 15px 0 25px 0; }
        .back-btn { background: white; border: none; width: 40px; height: 40px; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; font-size: 1.1rem; color: #1e293b; display: flex; align-items: center; justify-content: center; }
        .screen-title { font-size: 1.5rem; font-weight: 800; color: #0f172a; }

        /* --- VIDEO ADS PLATFORM --- */
        .task-card { background: white; border-radius: 24px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); border: 1px solid #e2e8f0; }
        .task-info h3 { font-size: 1rem; color: #1e293b; font-weight: 700; margin-bottom: 4px; }
        .task-info p { font-size: 0.75rem; color: #10b981; font-weight: 700; margin-bottom: 12px; }
        .video-wrapper { width: 100%; height: 220px; background: #000; border-radius: 18px; overflow: hidden; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        .timer-badge { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.8); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; z-index: 5; }
        .claim-btn { width: 100%; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; padding: 14px; border-radius: 16px; font-weight: 800; font-size: 1rem; cursor: pointer; margin-top: 12px; display: none; }

        /* --- WITHDRAW CONFIG --- */
        .form-card { background: white; border-radius: 28px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); border: 1px solid #e2e8f0; }
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-size: 0.78rem; font-weight: 800; color: #64748b; margin-bottom: 8px; }
        select, input { width: 100%; padding: 14px; border-radius: 16px; border: 1px solid #cbd5e1; font-size: 0.95rem; font-weight: 600; color: #1e293b; background: #f8fafc; outline: none; }
        .submit-btn { width: 100%; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; border: none; padding: 16px; border-radius: 18px; font-size: 1rem; font-weight: 800; cursor: pointer; margin-top: 10px; }

        /* --- PREMIUM NAVIGATION --- */
        .bottom-nav-bar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 440px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 35px; display: flex; justify-content: space-between; align-items: center; padding: 10px 24px; box-shadow: 0 12px 35px rgba(15, 23, 42, 0.08); z-index: 9999; border: 1px solid rgba(255, 255, 255, 0.8); }
        .nav-link { display: flex; flex-direction: column; align-items: center; color: #94a3b8; font-size: 0.65rem; font-weight: 700; cursor: pointer; }
        .nav-link i { font-size: 1.3rem; margin-bottom: 3px; }
        .nav-link.active { color: #2563eb; }
    </style>
</head>
<body>

    <div class="app-container">

        <div id="homeView" class="app-view active">
            <div class="main-balance-wrapper">
                <h1 class="main-balance-text"><span>Rs</span><span id="rs-balance">0.00</span></h1>
            </div>

            <div class="glass-card-section">
                <div class="stats-grid">
                    <div class="stat-card"><p class="label">ACCOUNT BALANCE</p><p class="value" id="acc-balance">0.00</p></div>
                    <div class="stat-card"><p class="label">ACTIVE PLANS</p><p class="value" id="active-plans">1</p></div>
                    <div class="stat-card"><p class="label">TOTAL WITHDRAW</p><p class="value" id="total-withdraw">0.00</p></div>
                    <div class="stat-card"><p class="label">TOTAL DEPOSIT</p><p class="value" id="total-deposit">0.00</p></div>
                </div>
            </div>

            <div class="actions-grid">
                <div class="action-card bg-deposit" onclick="alert('Deposit system active soon!')"><i class="fa-solid fa-wallet"></i><span>DEPOSIT</span></div>
                <div class="action-card bg-withdraw" onclick="switchView('withdrawView')"><i class="fa-solid fa-money-bill-transfer"></i><span>WITHDRAW</span></div>
                <div class="action-card bg-task" onclick="switchView('tasksView')"><i class="fa-solid fa-circle-play"></i><span>TASK VIDEO</span></div>
            </div>
        </div>

        <div id="tasksView" class="app-view">
            <div class="screen-header">
                <button class="back-btn" onclick="switchView('homeView')"><i class="fa-solid fa-arrow-left"></i></button>
                <h1 class="screen-title">Daily Video Tasks</h1>
            </div>

            <div class="task-card" id="taskCard1">
                <div class="task-info">
                    <h3>Premium Youtube Ad #1</h3>
                    <p>Reward: Rs 50.00</p>
                </div>
                <div class="video-wrapper">
                    <div class="timer-badge" id="badge1">30s</div>
                    <iframe id="video1" src="https://www.youtube.com/embed/dQw4w9WgXcQ?enablejsapi=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                </div>
                <button class="claim-btn" id="claimBtn1" onclick="claimReward('taskCard1', 50)">CLAIM RS 50.00 🎉</button>
            </div>

            <div class="task-card" id="taskCard2">
                <div class="task-info">
                    <h3>Premium Youtube Ad #2</h3>
                    <p>Reward: Rs 50.00</p>
                </div>
                <div class="video-wrapper">
                    <div class="timer-badge" id="badge2">30s</div>
                    <iframe id="video2" src="https://www.youtube.com/embed/3JZ_D3ELwOQ?enablejsapi=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                </div>
                <button class="claim-btn" id="claimBtn2" onclick="claimReward('taskCard2', 50)">CLAIM RS 50.00 🎉</button>
            </div>
        </div>

        <div id="withdrawView" class="app-view">
            <div class="screen-header">
                <button class="back-btn" onclick="switchView('homeView')"><i class="fa-solid fa-arrow-left"></i></button>
                <h1 class="screen-title">Withdraw Funds</h1>
            </div>

            <div class="form-card">
                <div class="input-group">
                    <label>CHOOSE METHOD</label>
                    <select id="method">
                        <option value="JazzCash">JazzCash</option>
                        <option value="EasyPaisa">EasyPaisa</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>ACCOUNT NUMBER</label>
                    <input type="number" id="acc-num" placeholder="e.g. 03001234567">
                </div>
                <div class="input-group">
                    <label>WITHDRAW AMOUNT (PKR)</label>
                    <input type="number" id="amount" placeholder="Minimum Rs 500">
                </div>
                <button class="submit-btn" onclick="submitWithdrawal()">Submit Request</button>
            </div>
        </div>

        <div class="bottom-nav-bar">
            <div class="nav-link active" id="nav-home" onclick="switchView('homeView')"><i class="fa-solid fa-house"></i><span>HOME</span></div>
            <div class="nav-link" id="nav-tasks" onclick="switchView('tasksView')"><i class="fa-solid fa-bolt"></i><span>TASKS</span></div>
            <div class="nav-link" id="nav-withdraw" onclick="switchView('withdrawView')"><i class="fa-solid fa-money-bill-transfer"></i><span>WITHDRAW</span></div>
        </div>

    </div>

    <script>
        // --- Standalone Wallet Storage (No APIs Required) ---
        let wallet = {
            balance: parseFloat(localStorage.getItem('w_balance')) || 0.00,
            total_withdraw: parseFloat(localStorage.getItem('w_withdraw')) || 0.00,
            total_deposit: parseFloat(localStorage.getItem('w_deposit')) || 0.00
        };

        function updateUI() {
            document.getElementById('rs-balance').innerText = wallet.balance.toFixed(2);
            document.getElementById('acc-balance').innerText = wallet.balance.toFixed(2);
            document.getElementById('total-withdraw').innerText = wallet.total_withdraw.toFixed(2);
            document.getElementById('total-deposit').innerText = wallet.total_deposit.toFixed(2);
        }

        // --- Foolproof View Switching ---
        function switchView(viewId) {
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('tasksView').style.display = 'none';
            document.getElementById('withdrawView').style.display = 'none';
            
            document.getElementById(viewId).style.display = 'block';

            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            if(viewId === 'homeView') {
                document.getElementById('nav-home').classList.add('active');
                updateUI();
            }
            if(viewId === 'tasksView') {
                document.getElementById('nav-tasks').classList.add('active');
                startYouTubeTimer('badge1', 'claimBtn1');
                startYouTubeTimer('badge2', 'claimBtn2');
            }
            if(viewId === 'withdrawView') document.getElementById('nav-withdraw').classList.add('active');
        }

        // --- Standard Universal YouTube Timer Engine ---
        function startYouTubeTimer(badgeId, claimBtnId) {
            const bElement = document.getElementById(badgeId);
            const cElement = document.getElementById(claimBtnId);
            
            if (!bElement || bElement.getAttribute('data-started') === 'true') return;
            bElement.setAttribute('data-started', 'true');

            let timeRemaining = 30;
            const timer = setInterval(() => {
                timeRemaining--;
                bElement.innerText = timeRemaining + "s";
                
                if (timeRemaining <= 0) {
                    clearInterval(timer);
                    bElement.style.display = 'none';
                    cElement.style.display = 'block'; 
                }
            }, 1000);
        }

        // --- Claim Rewards ---
        function claimReward(cardId, prizeAmount) {
            wallet.balance += prizeAmount;
            localStorage.setItem('w_balance', wallet.balance);
            updateUI();
            alert(`Rs ${prizeAmount}.00 wallet mein jama ho gaye hain! 🎉`);
            document.getElementById(cardId).remove();
        }

        // --- Submit Withdrawal ---
        function submitWithdrawal() {
            const method = document.getElementById('method').value;
            const number = document.getElementById('acc-num').value;
            const amount = parseFloat(document.getElementById('amount').value);

            if(!number || !amount) {
                alert("Please fill all details completely.");
                return;
            }

            if(amount > wallet.balance) {
                alert("Insufficient balance available!");
                return;
            }

            wallet.balance -= amount;
            wallet.total_withdraw += amount;
            
            localStorage.setItem('w_balance', wallet.balance);
            localStorage.setItem('w_withdraw', wallet.total_withdraw);
            
            alert(`Withdrawal request of Rs ${amount} submitted via ${method} to ${number}! 🚀`);
            document.getElementById('acc-num').value = "";
            document.getElementById('amount').value = "";
            switchView('homeView');
        }

        document.addEventListener('DOMContentLoaded', updateUI);
    </script>
</body>
</html>
