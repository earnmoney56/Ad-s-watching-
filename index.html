<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jh Seller - Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white p-4 font-sans">

    <div class="max-w-6xl mx-auto">
        <header class="mb-8 border-b border-gray-800 pb-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-green-400">Jh Seller Admin Dashboard</h1>
            <span class="bg-green-900 text-green-300 text-xs px-2 py-1 rounded">Live Realtime Connected</span>
        </header>

        <section class="mb-12">
            <h2 class="text-xl font-semibold text-yellow-400 mb-4">📋 Pending Plan Requests</h2>
            <div class="overflow-x-auto bg-gray-800 rounded-lg shadow">
                <table class="min-w-full table-auto">
                    <thead>
                        <tr class="bg-gray-700 text-left text-xs uppercase tracking-wider text-gray-300">
                            <th class="p-3">User Email</th>
                            <th class="p-3">Plan Name</th>
                            <th class="p-3">Amount</th>
                            <th class="p-3">Status</th>
                            <th class="p-3">Date</th>
                        </tr>
                    </thead>
                    <tbody id="plan-requests-table" class="divide-y divide-gray-700 text-sm">
                        <tr>
                            <td colspan="5" class="p-4 text-center text-gray-500">Waiting for live requests...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
        <!-- WITHDRAWALS SECTION -->
        <section>
            <h2 class="text-xl font-semibold text-blue-400 mb-4">💰 Pending Withdrawals</h2>
            <div class="overflow-x-auto bg-gray-800 rounded-lg shadow">
                <table class="min-w-full table-auto">
                    <thead>
                        <tr class="bg-gray-700 text-left text-xs uppercase tracking-wider text-gray-300">
                            <th class="p-3">User Email</th>
                            <th class="p-3">Amount</th>
                            <th class="p-3">Account Details</th>
                            <th class="p-3">Status</th>
                            <th class="p-3">Date</th>
                        </tr>
                    </thead>
                    <tbody id="withdrawals-table" class="divide-y divide-gray-700 text-sm">
                        <tr>
                            <td colspan="5" class="p-4 text-center text-gray-500">Waiting for live withdrawals...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        // Supabase Configuration
        const SUPABASE_URL = "https://dswddznritotagvgrjys.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_W6cCT9lMsTKekz0LBtQlfg_jGwN3iAA";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        async function fetchPlanRequests() {
            const { data, error } = await supabase
                .from('plan_requests')
                .select('*')
                .order('created_at', { ascending: false });

            const tbody = document.getElementById('plan-requests-table');
            if (error || !data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">No pending plan requests.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(req => `
                <tr class="hover:bg-gray-750 transition">
                    <td class="p-3 font-medium text-gray-200">${req.user_email}</td>
                    <td class="p-3 text-yellow-300">${req.plan_name}</td>
                    <td class="p-3 text-green-400 font-bold">${req.amount}</td>
                    <td class="p-3"><span class="px-2 py-0.5 text-xs bg-yellow-900 text-yellow-300 rounded-full">${req.status}</span></td>
                    <td class="p-3 text-gray-400 text-xs">${new Date(req.created_at).toLocaleString()}</td>
                </tr>
            `).join('');
        }

        async function fetchWithdrawals() {
            const { data, error } = await supabase
                .from('withdrawals')
                .select('*')
                .order('created_at', { ascending: false });

            const tbody = document.getElementById('withdrawals-table');
            if (error || !data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">No pending withdrawals.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(w => `
                <tr class="hover:bg-gray-750 transition">
                    <td class="p-3 font-medium text-gray-200">${w.user_email}</td>
                    <td class="p-3 text-green-400 font-bold">${w.amount}</td>
                    <td class="p-3 text-gray-300 max-w-xs truncate">${w.account_details}</td>
                    <td class="p-3"><span class="px-2 py-0.5 text-xs bg-yellow-900 text-yellow-300 rounded-full">${w.status}</span></td>
                    <td class="p-3 text-gray-400 text-xs">${new Date(w.created_at).toLocaleString()}</td>
                </tr>
            `).join('');
        }

        function initRealtime() {
            fetchPlanRequests();
            fetchWithdrawals();

            supabase.channel('plans-channel').on('postgres_changes', 
                { event: '*', schema: 'public', table: 'plan_requests' }, 
                () => { fetchPlanRequests(); }
            ).subscribe();

            supabase.channel('withdrawals-channel').on('postgres_changes', 
                { event: '*', schema: 'public', table: 'withdrawals' }, 
                () => { fetchWithdrawals(); }
            ).subscribe();
        }

        window.onload = initRealtime;
    </script>
</body>
</html>
